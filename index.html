<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개서 - Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 15px 0;
        }
        iframe {
            width: 100%;
            height: 750px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 안녕하세요! 이력서 / Profile</h1>
        <p>아래에서 PDF 이력서를 바로 확인하거나 다운로드할 수 있습니다.</p>
        
        <a href="ouu.pdf" target="_blank" class="btn">📄 PDF 이력서 새 창으로 보기</a>

        <div>
            <iframe src="?uu.pdf"></iframe>
        </div>
    </div>
</body>
</html>
